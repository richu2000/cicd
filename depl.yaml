apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-demo

  template:
    metadata:
      labels:
        app: cicd-demo

    spec:
      containers:
        - name: cicd-demo
          image: ghcr.io/richu2000/cicd-demo:1.0.0
          ports:
            - containerPort: 8080
